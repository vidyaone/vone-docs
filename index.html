<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vone-docs — Index</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161923;
    --border: #262b3a;
    --text: #e6e8ef;
    --muted: #9aa1b5;
    --accent: #7c9cff;
    --ok: #4ade80;
    --err: #f87171;
    --code-bg: #0b0d13;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  header {
    padding: 32px 24px 20px;
    border-bottom: 1px solid var(--border);
    max-width: 960px;
    margin: 0 auto;
  }
  header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  #search {
    flex: 1;
    min-width: 220px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.9rem;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  ul.files { list-style: none; padding: 0; margin: 0; }
  ul.files li {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
  }
  ul.files a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
  }
  ul.files a:hover { border-radius: 10px; background: #1c2030; }
  ul.files .name { font-size: 0.98rem; font-weight: 600; color: var(--accent); }
  ul.files .meta { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .state { color: var(--muted); padding: 20px 0; }
  .state.error { color: var(--err); }
  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 24px 40px;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>vone-docs</h1>
  <p>Developer documentation index — generated live from the repository.</p>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Filter pages…" autocomplete="off">
  </div>
  <div id="state" class="state">Loading pages…</div>
  <ul id="list" class="files"></ul>
</main>
<footer>
  Source: <a id="repolink" href="#" target="_blank" rel="noopener">github.com/vidyaone/vone-docs</a>
  &nbsp;·&nbsp; <span id="count"></span>
</footer>

<script>
(function () {
  var OWNER = "vidyaone";
  var REPO = "vone-docs";
  var SELF = "index.html";

  var listEl = document.getElementById("list");
  var stateEl = document.getElementById("state");
  var searchEl = document.getElementById("search");
  var countEl = document.getElementById("count");
  document.getElementById("repolink").href = "https://github.com/" + OWNER + "/" + REPO;

  var allFiles = [];

  function titleFromPath(path) {
    var base = path.replace(/\.html$/i, "").split("/").pop();
    return base;
  }

  function render(filter) {
    filter = (filter || "").toLowerCase().trim();
    listEl.innerHTML = "";
    var shown = 0;
    allFiles.forEach(function (f) {
      if (filter && f.path.toLowerCase().indexOf(filter) === -1) return;
      shown++;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = f.path;
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = titleFromPath(f.path);
      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = f.path + (f.size ? "  ·  " + Math.round(f.size / 1024) + " KB" : "");
      a.appendChild(name);
      a.appendChild(meta);
      li.appendChild(a);
      listEl.appendChild(li);
    });
    countEl.textContent = shown + " of " + allFiles.length + " page" + (allFiles.length === 1 ? "" : "s");
  }

  searchEl.addEventListener("input", function () { render(searchEl.value); });

  fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/git/trees/HEAD?recursive=1", {
    headers: { "Accept": "application/vnd.github+json" }
  })
    .then(function (r) {
      if (!r.ok) throw new Error("GitHub API returned " + r.status);
      return r.json();
    })
    .then(function (data) {
      if (!data.tree) throw new Error("Unexpected API response");
      allFiles = data.tree
        .filter(function (n) {
          return n.type === "blob" &&
            /\.html?$/i.test(n.path) &&
            n.path.toLowerCase() !== SELF;
        })
        .sort(function (a, b) { return a.path.localeCompare(b.path); });
      if (!allFiles.length) {
        stateEl.textContent = "No HTML pages found in this repository.";
        return;
      }
      stateEl.style.display = "none";
      render("");
    })
    .catch(function (err) {
      stateEl.className = "state error";
      stateEl.innerHTML = "Could not load the file list (" + String(err.message || err) +
        "). Browse the repository directly on " +
        "<a href='https://github.com/" + OWNER + "/" + REPO + "'>GitHub</a>.";
    });
})();
</script>
</body>
</html>
